<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="L'ambiance du Brûlot à Cossonay VD : photos du restaurant, de la salle et de l'esprit convivial de la maison.">
<meta name="theme-color" content="#0d5eaf">
<title>Ambiance — Le Brûlot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="ambiance">
<div id="site-header-mount"></div>

<section class="page-hero">
  <div class="container">
    <h1 id="titre-ambiance">Ambiance</h1>
    <p id="intro-ambiance">Chargement…</p>
  </div>
</section>

<main class="container">
  <div class="gallery" id="galerie-contenu">
    <p class="empty">Chargement des photos…</p>
  </div>
</main>

<div id="site-footer-mount"></div>

<script src="layout.js"></script>
<script>
async function chargerAmbiance() {
  try {
    const reponse = await fetch('ambiance.json');
    const data = await reponse.json();
    document.getElementById('titre-ambiance').textContent = data.titre;
    document.getElementById('intro-ambiance').textContent = data.intro;

    const galerie = document.getElementById('galerie-contenu');
    galerie.innerHTML = '';

    if (!data.photos || data.photos.length === 0) {
      galerie.innerHTML = '<p class="empty">Aucune photo pour le moment.</p>';
      return;
    }

    data.photos.forEach(photo => {
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = photo.image;
      img.alt = photo.legende;
      img.loading = 'lazy';
      const caption = document.createElement('figcaption');
      caption.textContent = photo.legende;
      fig.appendChild(img);
      fig.appendChild(caption);
      galerie.appendChild(fig);
    });
  } catch (e) {
    document.getElementById('galerie-contenu').innerHTML =
      '<p class="empty">Les photos n\'ont pas pu être chargées. Vérifiez que ambiance.json est bien présent à côté de cette page.</p>';
  }
}
chargerAmbiance();
</script>
</body>
</html>
