<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="L'ambiance d'AVRA Mykonos à Bournens VD : photos du restaurant, de la terrasse et de l'esprit taverne grecque.">
  <meta name="theme-color" content="#0d5eaf">
  <title>Ambiance | AVRA Mykonos</title>
  <style>
    :root { --bleu-drapeau:#0d5eaf; --bleu-egee:#0a4a8a; --bleu-clair:#eaf3fb; --blanc-chaux:#ffffff; --encre:#1c2b38; --ligne:#dfe8f0; --ombre:0 16px 36px rgba(13,58,94,.14); --rayon:16px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--encre); background:var(--blanc-chaux); font-family:Georgia,'Times New Roman',serif; line-height:1.7; }
    a { color:inherit; }
    img { display:block; max-width:100%; }
    .container { width:min(1120px,calc(100% - 2rem)); margin-inline:auto; }
    :focus-visible { outline:3px solid #c8622d; outline-offset:3px; }
    header { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:2px solid var(--bleu-drapeau); }
    .header-inner { min-height:76px; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding-block:.6rem; flex-wrap:wrap; }
    .brand { text-decoration:none; }
    .brand strong { display:block; color:var(--bleu-egee); font-size:1.4rem; letter-spacing:.03em; }
    .brand span { display:block; font-family:Arial,sans-serif; color:#5c7186; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; }
    nav { display:flex; flex-wrap:wrap; gap:.1rem; font-family:Arial,sans-serif; }
    nav a { padding:.45rem .58rem; border-radius:999px; color:var(--bleu-egee); font-size:.8rem; font-weight:700; text-decoration:none; }
    nav a:hover, nav a[aria-current="page"] { background:var(--bleu-clair); }
    .page-hero { padding:3.5rem 0 2.5rem; text-align:center; background:linear-gradient(180deg,var(--bleu-clair),var(--blanc-chaux)); }
    .page-hero h1 { margin:0 0 .6rem; color:var(--bleu-egee); font-size:clamp(2.1rem,6vw,3.3rem); font-style:italic; }
    .page-hero p { margin:0 auto; max-width:620px; font-family:Arial,sans-serif; color:#4f6478; }
    main { padding:3rem 0 4.5rem; }
    .gallery { display:grid; gap:1.1rem; grid-template-columns:1fr; }
    figure { margin:0; overflow:hidden; border-radius:var(--rayon); background:var(--blanc-chaux); box-shadow:var(--ombre); transition:transform .25s ease,box-shadow .25s ease; border:1px solid var(--ligne); }
    figure:hover { transform:translateY(-5px); box-shadow:0 20px 40px rgba(13,58,94,.22); }
    figure img { width:100%; aspect-ratio:4/3; object-fit:cover; transition:transform .35s ease; }
    figure:hover img { transform:scale(1.06); }
    figcaption { padding:.8rem 1rem; font-family:Arial,sans-serif; color:var(--bleu-egee); font-weight:700; font-size:.9rem; }
    .empty { text-align:center; padding:3rem 1rem; font-family:Arial,sans-serif; color:#4f6478; }
    footer { padding:2.2rem 1rem; background:var(--bleu-egee); color:#eaf3fb; text-align:center; font-family:Arial,sans-serif; }
    footer p { margin:.3rem 0; }
    @media (min-width:640px) { .gallery { grid-template-columns:repeat(2,1fr); } }
    @media (min-width:900px) { .gallery { grid-template-columns:repeat(3,1fr); } }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Retour à l'accueil AVRA Mykonos"><strong>AVRA Mykonos</strong><span>Taverne grecque – Bournens, Vaud</span></a>
      <nav aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="menu-page.html">La carte</a>
        <a href="ambiance-page.html" aria-current="page">Ambiance</a>
        <a href="index.html#localisation">Localisation</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 id="titre-ambiance">Ambiance</h1>
      <p id="intro-ambiance">Chargement…</p>
    </div>
  </section>

  <main class="container">
    <div class="gallery" id="galerie-contenu">
      <p class="empty">Chargement des photos…</p>
    </div>
  </main>

  <footer>
    <p><strong>AVRA Mykonos</strong></p>
    <p>Taverne grecque à Bournens, canton de Vaud, Suisse</p>
    <p>© 2026 AVRA Mykonos – Tous droits réservés</p>
  </footer>

  <script>
    async function chargerAmbiance() {
      try {
        const reponse = await fetch('ambiance.json');
        const data = await reponse.json();
        document.getElementById('titre-ambiance').textContent = data.titre;
        document.getElementById('intro-ambiance').textContent = data.intro;

        const galerie = document.getElementById('galerie-contenu');
        galerie.innerHTML = '';

        if (!data.photos || data.photos.length === 0) {
          galerie.innerHTML = '<p class="empty">Aucune photo pour le moment.</p>';
          return;
        }

        data.photos.forEach(photo => {
          const fig = document.createElement('figure');
          const img = document.createElement('img');
          img.src = photo.image;
          img.alt = photo.legende;
          img.loading = 'lazy';
          const caption = document.createElement('figcaption');
          caption.textContent = photo.legende;
          fig.appendChild(img);
          fig.appendChild(caption);
          galerie.appendChild(fig);
        });
      } catch (e) {
        document.getElementById('galerie-contenu').innerHTML =
          '<p class="empty">Les photos n\'ont pas pu être chargées. Vérifiez que ambiance.json est bien présent à côté de cette page.</p>';
      }
    }
    chargerAmbiance();
  </script>
</body>
</html>
